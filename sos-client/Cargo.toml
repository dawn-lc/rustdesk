[package]
name = "rustdesk-sos"
# 必须跟上上游协议基线，不能写自建版本号。
# 这个值会被写进 PeerInfo.version 发给控制端，控制端用 get_version_number()
# 做功能门控（相对鼠标需 1.4.5、多 UI 会话需 1.2.4、新剪贴板需 1.3.0）。
# 旧值 0.1.0 会被解析成 1000，比所有阈值都小 —— 相当于自称远古客户端，功能全被降级。
version = "1.4.9"
# edition 2024 需要 rustc 1.85+，与下面被 build.rs 逼出来的 rust-version 冲突；
# 且上游根 crate 也是 2021。
edition = "2021"
rust-version = "1.80"
# 本 crate 是下游衍生交付件，不是 RustDesk 官方发布，不沿用官方的 authors 与邮箱。
authors = ["RustDesk SOS maintainers"]
description = "RustDesk SOS 精简受控端 - 单文件远程协助客户端"
license = "AGPL-3.0"
readme = "README.md"
# 内部交付件，不发布到 crates.io
publish = false

[[bin]]
name = "rustdesk-sos"
path = "src/main.rs"

# PE 版本资源字符串表。由 build.rs 里的 winres 读取，写进 exe 的
# VS_VERSION_INFO，在「文件属性 → 详细信息」里可见。
#
# winres 0.1.12 的默认值有两个坑：
#   ProductName / FileDescription 都取 package.name（`rustdesk-sos`），
#   不是 package.description —— 所以描述得在这里显式覆盖；
#   CompanyName / LegalCopyright 根本不设，留空。
# 这里只写字符串字段；数值字段（FileVersion/ProductVersion）由 winres
# 自动从 package.version 填，不要在此重复。
[package.metadata.winres]
ProductName = "RustDesk SOS"
FileDescription = "RustDesk SOS 精简受控端 - 单文件远程协助客户端"
OriginalFilename = "rustdesk-sos.exe"
CompanyName = "RustDesk SOS maintainers"
LegalCopyright = "Copyright (C) RustDesk SOS maintainers. Licensed under AGPL-3.0."

[dependencies]
# 核心公共库
hbb_common = { path = "../libs/hbb_common" }

# 客户端专用库。上游已把 `message_proto` / `fs` / `protos` 等仅客户端使用的
# 部分从 `hbb_common` 拆到这里（`hbb_common` 现在只留服务端共用的信令协议、
# socket 与 Config 核心），所以 sos 的协议类型与文件传输都从 `base` 取。
base = { path = "../libs/base" }

# 屏幕捕获（仅 Windows DXGI + GDI）
scrap = { path = "../libs/scrap", default-features = false }

# 输入注入
enigo = { path = "../libs/enigo" }

# Windows 注册表
winreg = "0.52"

# 剪贴板操作
clipboard = { path = "../libs/clipboard" }

# Windows API
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    # tests/vpx_mem.rs 测量编码器物理内存占用
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media",
] }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 命令行解析
clap = { version = "4.5", features = ["derive"] }

# 日志
env_logger = "0.11"

# 上游完整服务框架
rustdesk = { path = ".." }

log = "0.4"

# 工具
anyhow = "1.0"
hex = "0.4"

# 钉住 `which` 的传递依赖 `home`：更新版本要求 rustc 1.88+
# 会把上面声明的 MSRV（1.80）顶掉。
home = "=0.5.9"

[build-dependencies]
cc = "1.0"
winres = "0.1"
bindgen = "0.72.1"

# ── 与上游根项目保持一致的依赖补丁 ──
#
# `hbb_common` 的 `webrtc` feature 由上游根 `Cargo.toml` 打开，而它依赖的三个
# crate 必须指向 rustdesk-org 的 fork（上游修了 Windows IPv6 候选地址、
# SettingEngine 的 max_binding_requests 等 bug）。
#
# `[patch]` **只对解析它的那个 workspace 根生效**。sos-client 被根项目
# `exclude`，是独立 workspace 根、有自己的 Cargo.lock，所以必须在这里重复声明
# 同一组补丁，否则会解析成 crates.io 上的原版 —— 表现为 hbb_common 编译失败：
#
#   no method named `set_ice_max_binding_requests` found for `SettingEngine`
#   cannot find function `set_no_congestion_control` in `webrtc::sctp::association`
#
# 上游调整这些 rev 时，跟着根 `Cargo.toml` 的 `[patch.crates-io]` 一起更新。
[patch.crates-io]
libxdo-sys = { path = "../libs/libxdo-sys-stub" }
# 逐块扩展读缓冲，而不是一来表头就按它声明的长度预留整帧。
tungstenite = { git = "https://github.com/rustdesk-org/tungstenite-rs", rev = "efce47e5364f00a63302cf07ab1fb13ded478914" }
# webrtc-util：Windows IPv6 地址字节序、适配器命名与结构体布局修正。
# webrtc-sctp：RTO 下限、MTU、拥塞控制与重排序窗口的修正（与 KCP 行为对齐）。
webrtc = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }
webrtc-util = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }
webrtc-sctp = { git = "https://github.com/rustdesk-org/webrtc", rev = "49c89bd8d30e6e62e4c1a96cee38fdc11f79ef63" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
